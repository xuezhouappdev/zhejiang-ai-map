<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重点任务清单｜浙江省人工智能高质量发展工作图谱</title>
<link rel="stylesheet" href="../vendor/modern-normalize.min.css">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/layout.css">
<style>
body.task-page { min-height:100vh; background:#F8FAFC; }
.task-page > .page-header { width:min(1500px,calc(100% - 48px)); margin:16px auto 0; padding:18px 22px; display:flex; align-items:center; justify-content:space-between; gap:24px; color:#fff; background:linear-gradient(105deg,#102F4F,#1E40AF 58%,#2563EB); border:1px solid #93C5FD; box-shadow:0 12px 30px rgba(30,64,175,.16); }
.task-page > .page-header small { display:block; margin-bottom:4px; color:#BFDBFE; font-family:Georgia,serif; letter-spacing:.16em; }
.task-page > .page-header h1 { margin:0; font-size:22px; letter-spacing:.06em; }
.task-page .breadcrumb { display:flex; align-items:center; gap:10px; color:#DBEAFE; font-size:13px; white-space:nowrap; }
.task-page .breadcrumb a { color:#fff; text-decoration:none; }
.task-page .breadcrumb a:hover { text-decoration:underline; }
.task-page .breadcrumb strong { color:#fff; font-weight:700; }
.task-page-content { width:min(1500px,calc(100% - 48px)); min-height:calc(100vh - 128px); margin:12px auto 24px; background:#F8FAFC; border:1px solid #93C5FD; box-shadow:0 24px 70px rgba(30,64,175,.18); overflow:hidden; }
.task-page-content .filters { max-width:none; margin:0; padding:12px 18px; }
.task-page .task-list { min-height:0; }
.task-page-content .task-list { padding:0 18px 20px; }
.task-page .list-head,.task-page .task-summary { grid-template-columns:var(--task-grid-columns); }
.task-page .importance-cell { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-start; gap:4px; }
.task-page .importance-cell .tag { white-space:nowrap; }
.task-page #taskListHead [data-sort-key] { cursor:pointer; user-select:none; }
.task-page #taskListHead [data-sort-key]:hover { background:#BFDBFE; }
.task-page .sort-indicator { margin-left:4px; color:#2563EB; font-size:11px; }
@media(max-width:900px){ .task-page > .page-header,.task-page-content { width:1120px; margin-left:12px; margin-right:12px; } }
</style>
</head>
<body class="task-page">
<header class="page-header">
  <div><small>KEY TASKS</small><h1>重点任务</h1></div>
  <nav class="breadcrumb" aria-label="面包屑导航"><a href="../index.html">工作推进总览</a><span>／</span><a href="details.html">五位一体任务清单</a><span>／</span><strong>重点任务</strong></nav>
</header>
<main class="task-page-content" id="taskDrawer" aria-hidden="false">
  <div class="filters">
    <select id="dimensionFilter">
      <option value="">全部所属领域</option>
      <option value="算力">算力</option><option value="数据">数据</option><option value="模型">模型</option><option value="应用">应用</option><option value="生态">生态</option>
    </select>
    <select id="importanceFilter" aria-label="筛选重要程度">
      <option value="">全部重要程度</option>
      <option value="孟主任关注▲">孟主任关注▲</option>
      <option value="省领导关注★">省领导关注★</option>
    </select>
    <input id="taskSearch" placeholder="搜索任务清单">
  </div>
  <div class="task-list">
    <div class="list-head" id="taskListHead"></div>
    <div id="taskRows"></div>
  </div>
</main>
<div class="modal-backdrop" id="progressModal">
  <form class="modal" id="progressForm">
    <h2>填报月度进展</h2>
    <div class="form-grid">
      <div class="field"><label>调度月份</label><input type="month" id="month" required></div>
      <div class="field"><label>任务状态</label><select id="status"><option>正常推进</option><option>进度滞后</option><option>暂停</option><option>已完成</option></select></div>
      <div class="field full"><label>月度进展情况</label><textarea id="progress" required></textarea></div>
      <div class="field full"><label>阶段性成果</label><textarea id="result"></textarea></div>
      <div class="field full"><label>存在问题</label><textarea id="problem"></textarea></div>
      <div class="field full"><label>需协调事项</label><textarea id="coordination"></textarea></div>
      <div class="field full"><label>下月工作安排</label><textarea id="next"></textarea></div>
    </div>
    <div class="modal-actions"><button type="button" class="secondary" id="modalCancel">取消</button><button type="submit" class="primary">提交月度进展</button></div>
  </form>
</div>
<div class="toast" id="toast">月度进展已保存</div>
<script src="../data/tasks.js"></script>
<script src="../js/state.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/home.js"></script>
<script src="../js/drawer.js"></script>
<script src="../js/ticker.js"></script>
<script defer src="../js/app.js"></script>
</body>
</html>
