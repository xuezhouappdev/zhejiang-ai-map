<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="styles/tokens.css" />

  <body>
    <main class="app">
      <div class="toolbar">
        <div>

        </div>
      </div>

        <header class="atlas-title">浙江省人工智能高质量发展工作图谱</header>
        <section class="top">
          <article class="top-card">
            <div class="top-head">省市一体　11个地市因地制宜</div>

          <article class="top-card">
            <div class="top-head">"机制＋专题"</div>
            <div class="mechanism"></div>
          </article>
        </section>
        <section class="main">
          <aside class="rail" id="railLeft"></aside>
          <div class="center">
            <div class="band">"1"总体统筹——总体目标</div>
            <div class="goals" id="goalsSection"></div>
            <div class="band five page-link" data-page="pages/details.html" role="link" tabindex="0">"5"五大维度——纵向链路推进</div>
            <div class="matrix" id="matrix"></div>
            <section class="guarantee-panel" aria-label="保障体系">
              <div class="guarantee-title">保障体系</div>
              <div class="guarantee-grid">
                <div class="muted">资讯库</div>
                <a href="pages/policies.html">政策库</a>
                <div class="muted">企业库</div>
                <a href="pages/projects.html">项目库</a>
                <a href="pages/scene.html">场景库</a>
                <a href="pages/experts.html">专家库</a>
                <a href="https://tzxmgl.zjzwfw.gov.cn/jbosth/#/login?appCode=kgs&loginConfigId=2000015" target="_blank" rel="noopener noreferrer">产业图谱</a>
              </div>
            </section>
          </div>
          <aside class="rail" id="railRight"></aside>
        </section>
      </section>
      <section class="news-ticker" role="region" aria-label="当日资讯滚动栏">
        <div class="ticker-label"><span>当日资讯</span><span class="ticker-date" id="tickerDate"></span></div>
        <div class="ticker-window"><div class="ticker-track" id="tickerTrack" aria-live="off"></div></div>
      </section>
    </main>
    <script src="data/policies.js"></script>
    <script src="data/tasks.js"></script>
    <script src="data/objects.js"></script>
