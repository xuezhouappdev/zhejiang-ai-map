<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浙江省人工智能高质量发展工作图谱</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/layout.css">
</head>
<body>
<main class="app">
  <div class="toolbar">
    <div>
      <div class="eyebrow">ZHEJIANG · ARTIFICIAL INTELLIGENCE</div>
      <h1>工作推进总览</h1>
    </div>
    <div class="hint">点击"重点任务"单元格查看对应任务清单</div>
  </div>
  <section class="atlas" aria-label="浙江省人工智能高质量发展工作推进图谱">
    <header class="atlas-title">浙江省人工智能高质量发展工作图谱</header>
    <section class="top">
      <article class="top-card">
        <div class="top-head">省市一体　11个地市因地制宜</div>
        <div class="map"><img id="zjMap" src="data/map.svg" alt="浙江省11个地市人工智能因地制宜布局图"></div>
      </article>
      <article class="top-card">
        <div class="top-head">组织架构</div>
        <div class="flow" id="orgFlow"></div>
      </article>
      <article class="top-card">
        <div class="top-head">"机制＋专题"</div>
        <div class="mechanism"></div>
      </article>
    </section>
    <section class="main">
      <aside class="rail" id="railLeft"></aside>
      <div class="center">
        <div class="band">"1"总体统筹——总体目标</div>
        <div class="goals" id="goalsSection"></div>
        <div class="band five">"5"五大维度——纵向链路推进</div>
        <div class="matrix" id="matrix"></div>
        <div class="guarantee">保障体系：资讯库｜政策库｜企业库｜项目库｜场景库｜专家库｜产业图谱</div>
      </div>
      <aside class="rail" id="railRight"></aside>
    </section>
  </section>
  <section class="news-ticker" role="region" aria-label="当日资讯滚动栏">
    <div class="ticker-label"><span>当日资讯</span><span class="ticker-date" id="tickerDate"></span></div>
    <div class="ticker-window"><div class="ticker-track" id="tickerTrack" aria-live="off"></div></div>
  </section>
</main>
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<section class="drawer" id="taskDrawer" aria-hidden="true">
  <header class="drawer-head">
    <div class="drawer-title"><small>KEY TASKS · 重点任务</small><h2 id="drawerTitle">重点任务清单</h2></div>
    <button class="close" id="drawerClose" aria-label="关闭">×</button>
  </header>
  <div class="filters">
    <select id="groupFilter"><option value="">全部重点任务</option></select>
    <select id="ownerFilter"><option value="">全部责任单位</option></select>
    <select id="timeFilter"><option value="">全部时间节点</option></select>
    <input id="taskSearch" placeholder="搜索任务清单">
  </div>
  <div class="task-list">
    <div class="list-head"><div>任务清单</div><div>责任单位</div><div>协同单位</div><div>时间节点</div></div>
    <div id="taskRows"></div>
  </div>
</section>
<div class="modal-backdrop" id="progressModal">
  <form class="modal" id="progressForm">
    <h2>填报月度进展</h2>
    <div class="form-grid">
      <div class="field"><label>调度月份</label><input type="month" id="month" required></div>
      <div class="field"><label>任务状态</label><select id="status"><option>正常推进</option><option>进度滞后</option><option>暂停</option><option>已完成</option></select></div>
      <div class="field full"><label>月度进展情况</label><textarea id="progress" required></textarea></div>
      <div class="field full"><label>阶段性成果</label><textarea id="result"></textarea></div>
      <div class="field full"><label>存在问题</label><textarea id="problem"></textarea></div>
      <div class="field full"><label>需协调事项</label><textarea id="coordination"></textarea></div>
      <div class="field full"><label>下月工作安排</label><textarea id="next"></textarea></div>
    </div>
    <div class="modal-actions"><button type="button" class="secondary" id="modalCancel">取消</button><button type="submit" class="primary">提交月度进展</button></div>
  </form>
</div>
<div class="toast" id="toast">月度进展已保存</div>
<script src="data/tasks.js"></script>
<script defer src="js/render.js"></script>
</body>
</html>
